name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # 跟 Lowex 的 build-ipa.yml 保持一致：用 macos-latest（Lowex 在同一账号上跑通过）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          if [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          else
            LATEST_26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
            if [ -n "$LATEST_26" ]; then
              sudo xcode-select -s "$LATEST_26/Contents/Developer"
            fi
          fi
          xcodebuild -version
      - name: Build (compile check, no signing)
        run: |
          xcodebuild -project WenKey/WenKey.xcodeproj -target WenKey -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
