name: Build WenKey IPA (unsigned)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          NEW=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$NEW" ] && sudo xcode-select -s "$NEW/Contents/Developer" || true
          xcodebuild -version
      - name: Build (unsigned)
        shell: bash
        run: |
          set -o pipefail
          # 注意：-target + -derivedDataPath 会被 xcodebuild 拒绝（要求 -scheme），
          # 而本工程没有共享 scheme；改用 SYMROOT 定向产物目录，效果相同。
          # SYMROOT 必须用绝对路径：相对路径会按工程目录解析，打包步骤在仓库根目录就找不到了。
          xcodebuild -project WenKey/WenKey.xcodeproj -target WenKey -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' SYMROOT="$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO clean build 2>&1 | tee build.log | tail -60
      - name: Show build errors
        if: failure()
        run: grep -n -B1 -A8 "error:\|error " build.log | head -80 || true
      - name: Package IPA
        run: |
          APP="build/Release-iphoneos/WenKey.app"
          if [ ! -d "$APP" ]; then APP=$(find build -name "WenKey.app" -maxdepth 4 | head -1); fi
          echo "APP=$APP"
          rm -rf Payload WenKey.ipa && mkdir Payload && cp -R "$APP" Payload/
          brew install ldid || true
          if which ldid; then
            # 带 entitlements 假签：否则 App Group 权利会被 ldid -S 抹掉，
            # 容器 App 与键盘扩展就无法共享主题/剪贴板/常用语。
            # 自签工具（AltStore / Sideloadly）安装时会用自己的证书重签，忽略这里的假签。
            ldid -SWenKey/App/WenKey.entitlements "Payload/WenKey.app/WenKey" || ldid -S "Payload/WenKey.app/WenKey" || true
            APEX_BIN=$(find Payload/WenKey.app/PlugIns -name "*.appex" -maxdepth 1 | head -1)
            if [ -n "$APEX_BIN" ]; then
              BIN_NAME=$(basename "$APEX_BIN" .appex)
              ldid -SWenKey/Keyboard/WenKeyKeyboard.entitlements "$APEX_BIN/$BIN_NAME" || ldid -S "$APEX_BIN/$BIN_NAME" || true
            fi
          fi
          zip -qry WenKey.ipa Payload
          unzip -l WenKey.ipa | head -20
      - name: Name assets from the tag
        id: name
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME}"; else V="v$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/WenKey.app/Info.plist)"; fi
          cp WenKey.ipa "WenKey-${V}.ipa"
          shasum -a 256 "WenKey-${V}.ipa" > "WenKey-${V}.ipa.sha256"
          echo "ipa=WenKey-${V}.ipa" >> "$GITHUB_OUTPUT"
          cat "WenKey-${V}.ipa.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.ipa }}
          path: |
            ${{ steps.name.outputs.ipa }}
            ${{ steps.name.outputs.ipa }}.sha256
      - name: Attach IPA to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "WenKey ${GITHUB_REF_NAME}" --notes "Unsigned test build (self-sign recommended for keyboard extensions; TrollStore fake-sign may not wake the keyboard). Normal container app with keyboard / clipboard / phrases / skins / settings tabs."
          gh release upload "${GITHUB_REF_NAME}" "${{ steps.name.outputs.ipa }}" "${{ steps.name.outputs.ipa }}.sha256" --clobber
